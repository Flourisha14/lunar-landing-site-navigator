name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: ESLint validation
        run: npm run lint
      - name: Frontend unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
      - name: Cesium lunar globe browser regression tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload browser test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
