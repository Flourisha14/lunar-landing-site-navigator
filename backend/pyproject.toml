# ==========================================
# Lunar Landing Site Navigator
# Scientific Backend Configuration
# ==========================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "lunar-landing-engine"
version = "0.1.0"

description = "Scientific computation engine for Lunar Landing Site Navigator"

readme = { text = "Independent Python scientific backend for lunar landing analysis.", content-type = "text/plain" }

requires-python = ">=3.12,<3.13"

license = "MIT"

authors = [
    {name = "Lunar Landing Site Navigator Contributors"}
]

# No scientific dependencies are required for
# the initial backend scaffold.
dependencies = []


# ==========================================
# Optional Dependencies
# ==========================================

[project.optional-dependencies]

# Development and testing tools
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "spiceypy>=8,<9",
    "rasterio>=1.4,<2"
]

# Scientific computation dependencies
# Install when implementing scientific modules.
science = [
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "spiceypy>=6,<9",
    "rasterio>=1.4,<2"
]

# API dependencies
# Install when implementing the HTTP backend.
api = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1"
]


# ==========================================
# Package Discovery
# ==========================================

[tool.setuptools.packages.find]
where = ["src"]


# ==========================================
# Pytest
# ==========================================

[tool.pytest.ini_options]

testpaths = ["tests"]

pythonpath = ["src"]

# Scientific validation tests will eventually
# use the scientific marker.
addopts = "--strict-markers"
markers = [
    "unit: pure unit tests and local invariants",
    "property: Hypothesis property-based tests",
    "scientific: independently validated reference comparisons",
    "integration: external dataset or dependency integration tests",
    "requires_spice: requires external SPICE kernels",
    "requires_dem: requires external lunar terrain model",
]


# ==========================================
# Ruff
# ==========================================

[tool.ruff]

line-length = 100

target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]


# ==========================================
# Mypy
# ==========================================

[tool.mypy]

python_version = "3.12"

strict = true

files = ["src"]


# ==========================================
# Coverage
# ==========================================

[tool.coverage.run]

source = ["lunar_engine"]

[tool.coverage.report]

show_missing = true