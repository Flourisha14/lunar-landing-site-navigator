[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-landing-engine"
version = "0.1.0"
description = "Scientific computation engine for Lunar Landing Site Navigator"
readme = {text = "Independent Python scientific backend for lunar landing analysis.", content-type = "text/plain"}
requires-python = ">=3.12"
license = "MIT"

authors = [
    {name = "Lunar Landing Site Navigator Contributors"}
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["lunar_engine"]

[tool.coverage.report]
show_missing = true